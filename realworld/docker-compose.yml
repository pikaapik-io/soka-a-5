    labels: { soka.dc: "DC-1", soka.host: "dc1-hostA2", soka.vm_type: V2 }
    networks: [dc1]
    ports: ["127.0.0.1:9107:8000"]
  # Kelompok V2 bagian DC-2 (vm08-vm11): spesifikasi sama dengan vm04-vm07 (0,3 CPU, 4g), tetapi
  # ditempatkan di DC-2 Efficiency (network dc2), host B0, B1, B2, B0.
  vm08:
    <<: *worker
    container_name: kpb_vm08
    cpu_quota: 3000   # V2 = 0,3 CPU
    mem_limit: 4g
    environment: { VM_NAME: vm08, VM_TYPE: V2, PORT: "8000" }
    labels: { soka.dc: "DC-2", soka.host: "dc2-hostB0", soka.vm_type: V2 }
    networks: [dc2]
    ports: ["127.0.0.1:9108:8000"]
  vm09:
    <<: *worker
    container_name: kpb_vm09
    cpu_quota: 3000   # V2 = 0,3 CPU
    mem_limit: 4g
    environment: { VM_NAME: vm09, VM_TYPE: V2, PORT: "8000" }
    labels: { soka.dc: "DC-2", soka.host: "dc2-hostB1", soka.vm_type: V2 }
    networks: [dc2]
    ports: ["127.0.0.1:9109:8000"]
  vm10:
    <<: *worker
    container_name: kpb_vm10
    cpu_quota: 3000   # V2 = 0,3 CPU
    mem_limit: 4g
    environment: { VM_NAME: vm10, VM_TYPE: V2, PORT: "8000" }
    labels: { soka.dc: "DC-2", soka.host: "dc2-hostB2", soka.vm_type: V2 }
    networks: [dc2]
    ports: ["127.0.0.1:9110:8000"]
  vm11:
    <<: *worker
    container_name: kpb_vm11
    cpu_quota: 3000   # V2 = 0,3 CPU
    mem_limit: 4g
    environment: { VM_NAME: vm11, VM_TYPE: V2, PORT: "8000" }
    labels: { soka.dc: "DC-2", soka.host: "dc2-hostB0", soka.vm_type: V2 }
    networks: [dc2]
    ports: ["127.0.0.1:9111:8000"]
  # Kelompok V1 (vm12-vm19): 1 PE x 1.000 MIPS -> 0,1 CPU, RAM 2g. Semua di DC-2 Efficiency
  # (network dc2), host B1, B2, B1, B2, B0, B1, B2, B0.
  vm12:
    <<: *worker
    container_name: kpb_vm12
    cpu_quota: 1000   # V1 = 0,1 CPU
    mem_limit: 2g
    environment: { VM_NAME: vm12, VM_TYPE: V1, PORT: "8000" }
    labels: { soka.dc: "DC-2", soka.host: "dc2-hostB1", soka.vm_type: V1 }
    networks: [dc2]
    ports: ["127.0.0.1:9112:8000"]
  vm13:
    <<: *worker
    container_name: kpb_vm13
    cpu_quota: 1000   # V1 = 0,1 CPU
