    mem_limit: 4g
    environment: { VM_NAME: vm06, VM_TYPE: V2, PORT: "8000" }
    labels: { soka.dc: "DC-1", soka.host: "dc1-hostA1", soka.vm_type: V2 }
    networks: [dc1]
