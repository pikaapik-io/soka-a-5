apiVersion: v1
kind: Namespace
metadata:
  name: dc1-performance
  labels:
    soka.dc: "DC-1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: dc2-efficiency
  labels:
    soka.dc: "DC-2"
---
apiVersion: v1
kind: Pod
metadata:
  name: kpb-vm00
  namespace: dc1-performance
  labels:
    app: soka-vm
    vm: vm00
    soka.dc: "DC-1"
    soka.host: "dc1-hostA0"
    soka.vm_type: "V3"
spec:
  nodeSelector:
    soka.host: "dc1-hostA0"
  containers:
    - name: worker
      image: soka-worker:v1
      imagePullPolicy: Never
      ports:
        - name: http
          containerPort: 8000
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 10
        timeoutSeconds: 1
      env:
        - name: VM_NAME
          value: "vm00"
        - name: VM_TYPE
          value: "V3"
        - name: PORT
          value: "8000"
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "1000m"
          memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vm00-svc
  namespace: dc1-performance
spec:
  type: NodePort
  selector:
    app: soka-vm
    vm: vm00
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30100
      protocol: TCP
---
